
<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dodawanie filmów — Twoja Strefa</title>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <style>
    body {
      font: 16px system-ui, sans-serif;
      background: #f1f5f9;
      color: #123;
      max-width: 720px;
      margin: 40px auto;
      padding: 20px;
    }

    main {
      background: white;
      padding: 28px;
      border-radius: 16px;
    }

    button,
    input {
      font: inherit;
      padding: 12px;
      margin: 10px 0;
    }

    button {
      background: #065f46;
      color: white;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    input {
      max-width: 100%;
    }

    #status {
      white-space: pre-wrap;
    }

    a {
      color: #065f46;
    }
  </style>
</head>

<body>
  <main>
    <h1>Dodaj film do Ubezpieczeń</h1>

    <p>
      1. Zaloguj się kontem administratora.<br />
      2. Wybierz film MP4 lub WebM.<br />
      3. Prześlij film do Cloudinary.<br />
      4. Skopiuj link i dodaj go w panelu CMS.
    </p>

    <button id="login" type="button">Zaloguj się</button>

    <p>
      <input
        type="file"
        id="file"
        accept="video/mp4,video/webm"
        aria-label="Wybierz film"
      />
    </p>

    <button id="send" type="button">Prześlij film</button>

    <p id="status" role="status" aria-live="polite"></p>

    <p>
      <input
        id="result"
        readonly
        style="width: 95%"
        aria-label="Adres filmu"
      />
    </p>

    <button id="copy" type="button">Kopiuj link</button>

    <p>
      <a href="/admin/">Przejdź do panelu administracyjnego</a>
    </p>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    const status = (message) => {
      $("status").textContent = message;
    };

    $("login").onclick = () => {
      netlifyIdentity.open();
    };

    $("copy").onclick = async () => {
      const url = $("result").value;

      if (!url) {
        status("Najpierw prześlij film.");
        return;
      }

      try {
        await navigator.clipboard.writeText(url);
        status("Skopiowano link do filmu.");
      } catch {
        status("Nie udało się skopiować linku. Skopiuj go ręcznie.");
      }
    };

    $("send").onclick = async () => {
      const file = $("file").files[0];
      const user = netlifyIdentity.currentUser();

      if (!user) {
        status("Najpierw zaloguj się.");
        netlifyIdentity.open();
        return;
      }

      if (!file || !["video/mp4", "video/webm"].includes(file.type)) {
        status("Wybierz film MP4 lub WebM.");
        return;
      }

      if (file.size > 100 * 1024 * 1024) {
        status("Maksymalny rozmiar filmu to 100 MB.");
        return;
      }

      $("send").disabled = true;
      $("result").value = "";
      status("Przesyłanie filmu...");

      try {
        const jwt = await user.jwt();

        const response = await fetch(
          "/.netlify/functions/video-sign",
          {
            method: "POST",
            headers: {
              Authorization: `Bearer ${jwt}`,
            },
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Błąd autoryzacji.");
        }

        const form = new FormData();
        form.append("file", file);

        for (const key of [
          "apiKey",
          "timestamp",
          "folder",
          "signature",
        ]) {
          form.append(
            key === "apiKey" ? "api_key" : key,
            data[key]
          );
        }

        const upload = await fetch(
          `https://api.cloudinary.com/v1_1/${encodeURIComponent(data.cloud)}/video/upload`,
          {
            method: "POST",
            body: form,
          }
        );

        const result = await upload.json();

        if (!upload.ok || !result.secure_url) {
          throw new Error(
            result.error?.message || "Błąd przesyłania filmu."
          );
        }

        $("result").value = result.secure_url;
        status(
          "Film został przesłany. Skopiuj link i dodaj go w panelu CMS."
        );
      } catch (error) {
        status(`Błąd: ${error.message}`);
      } finally {
        $("send").disabled = false;
      }
    };
  </script>
</body>
</html>
