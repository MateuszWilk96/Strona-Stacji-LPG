<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dodawanie filmów — Twoja Strefa</title><script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script><style>body{font:16px system-ui;background:#f1f5f9;color:#123;max-width:720px;margin:40px auto;padding:20px}main{background:white;padding:28px;border-radius:16px}button,input{font:inherit;padding:12px;margin:10px 0}button{background:#065f46;color:white;border:0;border-radius:8px;cursor:pointer}input{max-width:100%}#status{white-space:pre-wrap}a{color:#065f46}</style></head><body><main><h1>Dodaj film do Ubezpieczeń</h1><p>1. Zaloguj się kontem administratora. 2. Wybierz film MP4/WebM. 3. Po przesłaniu skopiuj link i wklej go w panelu w polu „Link do filmu”.</p><button id="login">Zaloguj się</button><p><input type="file" id="file" accept="video/mp4,video/webm"></p><button id="send">Prześlij film</button><p id="status" role="status"></p><p><input id="result" readonly style="width:95%" aria-label="Adres filmu"></p><button id="copy">Kopiuj link</button><p><a href="/admin/">Przejdź do panelu administracyjnego</a></p></main><script>
const $=id=>document.getElementById(id);$('login').onclick=()=>netlifyIdentity.open();$('copy').onclick=async()=>{await navigator.clipboard.writeText($('result').value);$('status').textContent='Skopiowano link.'};
$('send').onclick=async()=>{const file=$('file').files[0];const user=netlifyIdentity.currentUser();if(!user){$('status').textContent='Najpierw zaloguj się.';netlifyIdentity.open();return}if(!file||!['video/mp4','video/webm'].includes(file.type)){ $('status').textContent='Wybierz MP4 lub WebM.';return }if(file.size>100*1024*1024){$('status').textContent='Maksymalny rozmiar to 100 MB.';return} $('send').disabled=true;$('status').textContent='Przesyłanie filmu...';try{const jwt=await user.jwt();const r=await fetch('/.netlify/functions/video-sign',{method:'POST',headers:{Authorization:'Bearer '+jwt}});const data=await r.json();if(!r.ok)throw Error(data.error||'Błąd autoryzacji');const form=new FormData();form.append('file',file);for(const k of ['apiKey','timestamp','folder','signature'])form.append(k==='apiKey'?'api_key':k,data[k]);const up=await fetch('https://api.cloudinary.com/v1_1/'+encodeURIComponent(data.cloud)+'/video/upload',{method:'POST',body:form});const result=await up.json();if(!up.ok||!result.secure_url)throw Error(result.error?.message||'Błąd przesyłania');$('result').value=result.secure_url;$('status').textContent='Film przesłany. Skopiuj link i dodaj go w panelu.'}catch(e){$('status').textContent='Błąd: '+e.message}finally{$('send').disabled=false}};
</script></body></html>
